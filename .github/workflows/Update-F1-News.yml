name: Hourly Script

on:
  schedule:
    - cron: '0 * * * *'   # every hour at minute 0
  workflow_dispatch:       # allows manual trigger too

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run my script
        run: /src/scripts/scrape-f1-news.mjs
